[workspace]
members = [".", "tools/breakpoints"]

[package]
name = "engine"
version = "0.1.0"
edition = "2024"
description = "WebAssembly engine and debugger"
repository = "https://github.com/jacobrobertsbaca/engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1.1"
js-sys = "0.3.83"
serde = "1.0.228"
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6.5"
tar = "0.4"
tsify = "0.5.6"
wasm-bindgen="0.2"
wasm-bindgen-futures = "0.4.58"
wasmer = { version = "6.1.0", default-features = false, features = [
    "js",
    "js-default",
    "wasm-types-polyfill",
    "enable-serde",
] }
wasmer-wasix = { version = "0.601.0", default-features = false, features = [
    "js",
    "js-default"
] }
web-sys = { version = '0.3.83', features = ['DedicatedWorkerGlobalScope', 'console'] }
futures = "0.3.31"
console_error_panic_hook = "0.1.7"
async-trait = "0.1.89"
wasmer-config = "0.601.0"
serde_repr = "0.1.20"
anyhow = "1.0"
gimli = { git = "https://github.com/gimli-rs/gimli" }
wasm-encoder = { version = "0.245", features = ["wasmparser"] }
wasmparser = "0.245"
serde_json = "1.0.149"
regex = "1.12.3"
derive_more = { version = "2", features = ["display"] }
crc32fast = "1.5"
globset = "0.4"
# Compile out all logging: it is unused, and its global state is not worker-safe.
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals"]
